<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion de eventos con parametros</title>
  </head>
  <body>
    <div>
      <h1>Ejemplo de Gestion de Eventos con Parametros</h1>
      <button onclick="mostrarMensaje('Hola, estamos aprendiendo JS ')">
        Ver mensaje
      </button>
    </div>
    <script>
      function mostrarMensaje(texto) {
        alert(texto);
      }
    </script>
  </body>
</html>
